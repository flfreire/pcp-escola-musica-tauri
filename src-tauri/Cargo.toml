[package]
name = "pcp-escola-musica"
version = "1.2.0"
description = "Sistema Integrado de PCP — Instituto Nilto Musicalização - Projeto Caminhos da Música"
authors = ["Instituto Nilto Musicalização"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pcp_escola_musica_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
