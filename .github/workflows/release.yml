name: Build & Release Multiplataforma (Tauri)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--bundles nsis,msi'
          - platform: 'ubuntu-22.04'
            args: '--bundles deb,appimage'
          - platform: 'macos-latest'
            args: '--bundles dmg'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies (WebKitGTK & AppImage)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Install Frontend Dependencies
        run: npm install

      - name: Generate Native Platform Icons
        run: npx tauri icon src-tauri/icons/app-icon.png

      - name: Build Frontend
        run: npm run build

      - name: Build and Publish Tauri Bundles (Windows Setup, Linux Deb/AppImage, macOS DMG)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Instituto Nilto Musicalização — Projeto Caminhos da Música (PCP v__VERSION__)'
          releaseBody: |
            ## 🎵 Instituto Nilto Musicalização — Projeto Caminhos da Música (PCP v__VERSION__)

            Aplicação desktop multiplataforma construída em **Tauri v2 + React** fundamentada nos conceitos de **Planejamento e Controle da Produção (PCP)** adaptados à gestão musical e educacional.

            ### ✨ Novidades desta Versão (v__VERSION__):
            - **Correção da Exportação de Planilha**: Implementado salvamento nativo via Rust com salvamento direto na pasta de Downloads e abertura automática no gerenciador de arquivos (Windows Explorer, Mac Finder e Linux).
            - Identidade Institucional atualizada para **Instituto Nilto Musicalização — Projeto Caminhos da Música**.
            - Design executivo e responsivo com paleta sóbria (Verde-Petróleo, Ardósia e Neutros Quentes) e alternância entre **Modo Claro Executivo** e **Modo Grafite Sóbrio**.

            ### 📦 Instaladores Disponíveis nesta Release:
            - **Windows**: Instalador Setup (`.exe` NSIS e `.msi`)
            - **Linux**: Pacotes `.deb` (Debian/Ubuntu) e `.AppImage`
            - **macOS**: Imagem de Disco `.dmg`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
